name = truvoice
summary = "Centigram TruVoice"
description = """Centigram TruVoice as a native NVDA synthesizer.

The engine is a decompilation of the 1997 SAPI 4 original, verified to
produce byte-identical audio, built as an ordinary DLL. It needs no SAPI:
no COM, no registry entries, and no 32-bit bridge process.

Ten voices: Peter, Sidney, Eager Eddie, Deep Douglas, Biff,
Grandpa Amos, Melvin, Alex, Wanda and Julia."""
author = "OpenTV"
version = 0.5.1
url = https://github.com/RetroBunn/OpenTV
minimumNVDAVersion = 2026.1.0
lastTestedNVDAVersion = 2026.3.0
