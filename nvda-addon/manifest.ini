name = opentv
summary = "OpenTV"
description = """OpenTV as a native NVDA synthesizer.

The engines are decompilations of the SAPI 4 originals, each verified to
produce byte-identical audio, built as an ordinary DLL. It needs no SAPI:
no COM, no registry entries, and no 32-bit bridge process.

Twenty voices in two languages. American English: Peter, Sidney,
Eager Eddie, Deep Douglas, Biff, Grandpa Amos, Melvin, Alex, Wanda and
Julia. Castilian Spanish: Pedro, Jorge, Ricardo, Paco, Luis, Ezequiel,
Rogelio, Carlos, Josefa and Isabel.

Each voice is listed with the language it speaks and tagged for NVDA's
automatic language switching."""
author = "OpenTV"
version = 1.0
url = https://github.com/RetroBunn/OpenTV
minimumNVDAVersion = 2026.1.0
lastTestedNVDAVersion = 2026.3.0
